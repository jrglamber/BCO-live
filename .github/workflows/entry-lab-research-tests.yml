name: Entry Lab research tests
on:
  pull_request:
    paths:
      - 'entry_lab.py'
      - 'test_entry_lab_maturation_backlog.py'
      - '.github/workflows/entry-lab-research-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test research-only maturation
        run: python -m unittest -v test_entry_lab_maturation_backlog
